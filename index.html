<style>

  .tabs{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}

  .list{padding:14px 16px}

  .sub.on{background:var(--accent);color:#fff}
  .zoom{position:fixed;inset:0;z-index:40;background:rgba(15,12,10,.9);display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}

  .zoom .zx{position:absolute;top:16px;right:16px;background:#fff}
  .ph-edit{display:flex;gap:14px;align-items:center}
  .ph-prev{width:120px;aspect-ratio:16/10;border-radius:12px;background:var(--sand);overflow:hidden;display:grid;place-items:center;font-size:30px;flex-shrink:0;border:1px solid var(--line)}
  .ph-prev img{width:100%;height:100%;object-fit:cover}
  .ph-act{flex:1;min-width:0}
  .ph-btn{display:inline-block;margin:0;cursor:pointer;color:#fff;font-size:13px}
  .arow .em img{width:100%;height:100%;object-fit:cover;border-radius:12px}
  .arow .em{overflow:hidden}
  .thumb{width:72px;height:72px;border-radius:14px;display:grid;place-items:center;font-size:34px;flex-shrink:0;background:var(--sand)}
  .info{flex:1;min-width:0}
  .info h4{font-size:15px;font-weight:700;line-height:1.3}

  .price-row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:8px;gap:8px}
  .old{font-size:12px;color:#a99a8c;text-decoration:line-through}
  .new{font-size:15px;font-weight:700}
  .qty{display:flex;align-items:center;gap:6px}
  .qbtn{width:32px;height:32px;border-radius:50%;font-size:18px;font-weight:700;display:grid;place-items:center;background:var(--sand);color:var(--ink)}

  .qnum{min-width:20px;text-align:center;font-weight:700}
  .add{padding:8px 16px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:13px}
  .vlabel{font-size:11.5px;font-weight:700;color:var(--accent);margin:8px 0 4px;text-transform:uppercase;letter-spacing:.04em}
  .vrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px dashed var(--line)}

  .vname{font-size:13.5px;font-weight:600;line-height:1.3}
  .vname span{display:block;font-weight:500;font-size:12px;color:var(--muted)}
  .vname s{color:#b5a797}
  .vrow .add{padding:6px 13px;font-size:12px}
  .vrow .qbtn{width:28px;height:28px;font-size:16px}

  .cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;width:calc(100% - 32px);max-width:528px;background:var(--ink);color:#fff;border-radius:18px;padding:12px 14px 12px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 14px 30px rgba(0,0,0,.25);z-index:10}
  .cartbar .ct{font-size:12px;opacity:.75}
  .cartbar .tt{font-weight:700;font-size:16px}
  .cartbar button{margin-left:auto;background:var(--coral);color:#fff;font-weight:700;padding:12px 18px;border-radius:14px}

  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .sheet-head h3{font-size:22px}
  .x{width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:16px}
  .sum-line{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:7px 0;border-bottom:1px dashed var(--line)}
  .sum-total{display:flex;justify-content:space-between;margin-top:10px;font-size:14px;color:var(--muted)}
  .sum-total.big{color:var(--ink);font-weight:700;font-size:17px}
  .disc{color:var(--coral)}
  label{display:block;font-size:13px;font-weight:600;margin:16px 0 6px;color:#4a3f37}
  input,select,textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--accent,var(--sea))}
  textarea{resize:vertical;min-height:70px}
  .hint{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45}
  .preview{margin-top:18px;background:#e7f6e9;border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.55;white-space:pre-wrap;color:#1f3b25}
  .plabel{margin-top:18px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#3f7a4c}
  .preview{margin-top:6px !important}
  .hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1}

  .ktitle{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px}

  .ktitle h4{font-size:15px}

  .icons,.confirm{width:100%;justify-content:flex-end}
  .icons{display:flex;gap:6px}
  .ib{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:14px;display:grid;place-items:center}
  .ib:disabled{opacity:.3;cursor:default}
  .ib.del{color:var(--danger)}
  .confirm{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:600;color:var(--danger)}
  .confirm button{padding:6px 10px;border-radius:10px;font-weight:700;font-size:12px}
  .confirm .yes{background:var(--danger);color:#fff}
  .confirm .no{border:1px solid var(--line);background:#fff;color:var(--ink)}
  .savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;width:calc(100% - 32px);max-width:528px;background:var(--ink);color:#fff;border-radius:18px;padding:12px 12px 12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 14px 30px rgba(0,0,0,.25);z-index:10;font-size:13px}
  .savebar .msg{flex:1;line-height:1.35}
  .savebar .cancel{padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.3)}

  .status{margin:0 16px 14px;padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.45}

  .status.warn{background:#fff4e6;color:#6d5640;border:1px dashed #e8c79e}

  .vedit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 36px;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .vedit .vh{grid-column:1 / span 2}
  .vedit .ib{grid-row:span 2;height:auto}
  .en-box{margin-top:16px;padding:4px 14px 14px;border-radius:14px;background:#f2f6f9;border:1px solid #dde7ee}
  .en-title{font-size:13px;font-weight:700;margin-top:10px}
  .en-title span{font-weight:500;color:var(--muted);font-size:12px}
  .vedit input{padding:10px 12px;font-size:15px}
  .switch{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:14px;font-weight:600}
  .switch input{width:20px;height:20px;accent-color:var(--sea)}
  .btn{display:block;width:100%;padding:14px;border-radius:14px;font-weight:700;font-size:15px;margin-top:18px;background:var(--sea);color:#fff}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);margin-top:10px}
  .linkish{color:var(--sea);font-weight:700;font-size:13px;margin-top:10px}
  .gate{padding:60px 24px;text-align:center;color:var(--muted)}
  .gate h2{color:var(--ink);margin-bottom:8px}

  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--sea);margin:0 auto 14px;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .demo{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:#fff4e6;border:1px dashed #e8c79e;color:#6d5640;font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:999px;z-index:30}
  .login{max-width:380px;margin:0 auto;padding:60px 22px 30px}
  .login h2{text-align:center;font-size:26px;margin-bottom:6px}
  .login .resto-logo{width:60px;height:60px;font-size:28px}
</style>

const rp = n => 'Rp ' + Math.round(Number(n)||0).toLocaleString('id-ID');
const disc = h => (Number(h)||0) * (100 - (Number(CFG.promo.diskon)||0)) / 100;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const color = c => /^#[0-9a-f]{6}$/i.test(c||'') ? c : '#0f6b6b';
const digits = s => String(s||'').replace(/\D/g,'');
const safeUrl = u => /^https:\/\/[^\s"'<>]+$/.test(u||'') ? u : '';
const GROUP_IC = { 'Makanan':'🍛', 'Minuman':'🥤', 'Dessert':'🍨', 'Snack':'🍟' };
const waNum = s => { const d = digits(s); return d.startsWith('0') ? '62' + d.slice(1) : d; };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c === 'x' ? r : (r&3|8)).toString(16); }));
const fmtDate = d => { try { return new Date(d+'T12:00:00+08:00').toLocaleDateString(L().locale,{day:'numeric',month:'long',year:'numeric',timeZone:'Asia/Makassar'}); } catch(e){ return d; } };

function promoStatus(){
  const now = Date.now();
  const a = Date.parse(CFG.promo.mulai + 'T00:00:00+08:00');
  const b = Date.parse(CFG.promo.selesai + 'T23:59:59+08:00');
  if (now < a) return 'soon';
  if (now > b) return 'ended';
  return 'on';
}
/* Data dari penyimpanan dianggap tidak tepercaya: rapikan bentuknya */
function normalize(d){
  if (!d || typeof d !== 'object' || !d.resto || !d.promo) return null;
  const out = { promo:{
      diskon: Math.min(100, Math.max(0, Number(d.promo.diskon)||0)),
      mulai: /^\d{4}-\d{2}-\d{2}$/.test(d.promo.mulai) ? d.promo.mulai : DEFAULT.promo.mulai,
      selesai: /^\d{4}-\d{2}-\d{2}$/.test(d.promo.selesai) ? d.promo.selesai : DEFAULT.promo.selesai },
    order: Array.isArray(d.order) ? d.order.filter(k => d.resto[k]) : Object.keys(d.resto),
    resto:{} };
  for (const k of out.order){
    const r = d.resto[k] || {};
    const m = r.menu || {};
    out.resto[k] = { nama:String(r.nama||k), wa:waNum(r.wa), warna:color(r.warna), logo:String(r.logo||'🍽️'),
      info:String(r.info||''), info_en:String(r.info_en||''), menu:{} };
    for (const {k:kk} of KAT){
      out.resto[k].menu[kk] = (Array.isArray(m[kk]) ? m[kk] : []).map(i => {
        const it = { id:String(i.id||uid()), n:String(i.n||'Menu'), d:String(i.d||''), e:String(i.e||'🍽️') };
        if (i.g) it.g = String(i.g);
        if (i.n_en) it.n_en = String(i.n_en);
        if (i.d_en) it.d_en = String(i.d_en);
        if (i.off) it.off = true;
        if (safeUrl(i.f)) it.f = i.f;
        if (Array.isArray(i.v) && i.v.length) it.v = i.v.map(v => { const o = {n:String(v.n||''), h:Math.max(0, Number(v.h)||0)}; if (v.n_en) o.n_en = String(v.n_en); return o; });
        else it.h = Math.max(0, Number(i.h)||0);
        return it;
      });
    }
  }
  return out.order.length ? out : null;
}

/* ---------- KERANJANG ---------- */
function cart(key){ return state.carts[key] || (state.carts[key] = {}); }
function visible(key, kat){ return (CFG.resto[key].menu[kat] || []).filter(i => !i.off); }
function cartLines(key){
  const c = cart(key), out = [];
  KAT.forEach(({k}) => visible(key, k).forEach(i => {
    if (i.v) i.v.forEach((v, x) => { const q = c[i.id+'|'+x]||0; if (q) out.push({n:`${i.n} (${v.n})`, h:v.h, q}); });
    else if (c[i.id] > 0) out.push({n:i.n, h:i.h, q:c[i.id]});
  }));
  return out;
}
function buildMessage(key){
  const t = L();
  const lines = cartLines(key).map(i => `- ${i.q}x ${i.n}`).join('\n');
  const nama = state.nama.trim() || t.phName;
  const jam = state.jam ? state.jam.replace(':', '.') : t.phTime;
  return t.msg(t.greet(new Date().getHours()), nama, lines, jam);
}

const CONF = window.AMOR_CONFIG || {};
const SB_READY = !!(CONF.SUPABASE_URL && CONF.SUPABASE_ANON_KEY && !/XXXX/.test(CONF.SUPABASE_URL) && window.supabase);
const sb = SB_READY ? window.supabase.createClient(CONF.SUPABASE_URL, CONF.SUPABASE_ANON_KEY) : null;
const chk = async q => { const r = await q; if (r.error) throw r.error; return r.data; };

async function loadFromSupabase(){
  const [s, r, m, v] = await Promise.all([
    chk(sb.from('settings').select('*').eq('id', 1).maybeSingle()),
    chk(sb.from('restaurants').select('*').order('urutan')),
    chk(sb.from('menu_items').select('*').order('urutan')),
    chk(sb.from('menu_variants').select('*').order('urutan'))
  ]);
  const cfg = { promo:{ diskon: s ? s.diskon : 15, mulai: s ? s.mulai : DEFAULT.promo.mulai, selesai: s ? s.selesai : DEFAULT.promo.selesai },
                order:[], resto:{} };
  (r || []).forEach(x => {
    cfg.order.push(x.id);
    cfg.resto[x.id] = { nama:x.nama, wa:x.wa, warna:x.warna, logo:x.logo, info:x.info, info_en:x.info_en,
                        menu:{ biasa:[], bundling:[], catering:[] } };
  });
  const vars = {};
  (v || []).forEach(x => (vars[x.item_id] = vars[x.item_id] || []).push({ n:x.nama, n_en:x.nama_en || undefined, h:x.harga }));
  (m || []).forEach(x => {
    const R = cfg.resto[x.restaurant_id]; if (!R || !R.menu[x.kategori]) return;
    const o = { id:x.id, n:x.nama, d:x.deskripsi, e:x.emoji };
    if (x.kelompok) o.g = x.kelompok;
    if (x.nama_en) o.n_en = x.nama_en;
    if (x.deskripsi_en) o.d_en = x.deskripsi_en;
    if (!x.tersedia) o.off = true;
    if (x.foto_url) o.f = x.foto_url;
    if (vars[x.id] && vars[x.id].length) o.v = vars[x.id]; else o.h = x.harga || 0;
    R.menu[x.kategori].push(o);
  });
  return normalize(cfg);
}

function itemCard(i, c){
  const ph = safeUrl(i.f) ? ' has-photo' : '';
  if (i.v) {
    const any = i.v.some((_, x) => c[i.id+'|'+x]);
    const min = Math.min(...i.v.map(v => v.h));
    return `<div class="item${ph} ${any?'sel':''}">

      <div class="info">
        <h4>${esc(tr(i,'n'))}</h4><p>${esc(tr(i,'d'))}</p>
        <div class="vlabel">${L().pickVar} ${rp(disc(min))}</div>

            <div class="vname">${esc(tr(v,'n'))}<span><s>${rp(v.h)}</s> ${rp(disc(v.h))}</span></div>
            ${qtyCtrl(k, q)}
          </div>`; }).join('')}
      </div></div>`;
  }
  const q = c[i.id]||0;
  return `<div class="item${ph} ${q?'sel':''}">
    ${thumbHTML(i)}
    <div class="info">
      <h4>${esc(tr(i,'n'))}</h4><p>${esc(tr(i,'d'))}</p>

}
function groupsOf(items){ const g = []; items.forEach(i => { const k = i.g || ''; if (!g.includes(k)) g.push(k); }); return g; }
function subTabs(groups){

    <span>${GROUP_IC[g] || '🍽️'}</span>${esc(g ? (L().groups[g] || g) : L().other)}</button>`).join('')}</div>`;
}
function itemsHTML(items, c){
  if (!items.length) return `<div class="empty">${L().empty}</div>`;

  items.forEach(i => { const g = i.g||''; let grp = groups.find(x => x.g === g); if (!grp) groups.push(grp = {g, list:[]}); grp.list.push(i); });
  return groups.map(grp => (grp.g ? `<div class="ghead">${esc(L().groups[grp.g] || grp.g)}</div>` : '') + grp.list.map(i => itemCard(i, c)).join('')).join('');

function sheetView(){
  const key = state.resto, r = CFG.resto[key];
  const lines = cartLines(key);
  const normal = lines.reduce((a,i)=>a+i.h*i.q,0);
  const total = lines.reduce((a,i)=>a+disc(i.h)*i.q,0);
  const href = waHref(key);
  return `
  <div class="overlay" data-close-bg style="--accent:${color(r.warna)}">
    <div class="sheet">
      <div class="sheet-head"><h3>${L().orderAt} ${esc(r.nama)}</h3><button class="x" data-close aria-label="${L().close}">✕</button></div>
      ${lines.map(i => `<div class="sum-line"><span>${i.q}x ${esc(i.n)}</span><span>${rp(i.h*i.q)}</span></div>`).join('')}
      <div class="sum-total"><span>${L().subtotal}</span><span>${rp(normal)}</span></div>
      <div class="sum-total disc"><span>${L().discount} ${esc(CFG.promo.diskon)}%</span><span>− ${rp(normal-total)}</span></div>
      <div class="sum-total big"><span>${L().total}</span><span>${rp(total)}</span></div>
      <label for="nama">${L().name}</label>
      <input id="nama" type="text" placeholder="${L().namePh}" value="${esc(state.nama)}" autocomplete="name">
      <label for="jam">${L().time}</label>
      <input id="jam" type="time" value="${esc(state.jam)}">
      <div class="hint">${L().keyHint}</div>
      <div class="plabel">${L().preview}</div>
      <div class="preview" id="preview">${esc(buildMessage(key))}</div>
      <a class="wa ${href?'':'disabled'}" id="wa" href="${href||'#'}" target="_blank" rel="noopener">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.4 14.2c-.2.6-1.3 1.2-1.8 1.3-.5.1-1 .1-1.7-.1-.4-.1-.9-.3-1.5-.6-2.7-1.2-4.4-3.9-4.5-4.1-.1-.2-1.1-1.5-1.1-2.8 0-1.3.7-2 1-2.3.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.4.6-.4.4c-.1.1-.3.3-.1.6.2.3.7 1.2 1.6 1.9 1.1 1 2 1.3 2.3 1.4.3.1.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>
        ${L().send}</a>
      <div class="err" id="err">${href ? '' : L().needInfo}</div>
    </div>
  </div>`;
}



/* ---------- EVENTS ---------- */
function on(sel, fn){ document.querySelectorAll(sel).forEach(el => el.onclick = e => fn(el, e)); }
function bind(){
  on('[data-go]', b => { location.hash = b.dataset.go; });
  on('[data-lang]', b => setLang(b.dataset.lang));
  on('[data-home]', () => { location.hash = ''; });
  on('[data-retry]', () => load());
  on('[data-sub]', b => { state.sub = b.dataset.sub; render(); });
  on('[data-zoom]', b => { state.zoom = b.dataset.zoom; render(); });
  on('[data-unzoom]', () => { state.zoom = null; render(); });
  on('[data-tab]', b => { state.tab = b.dataset.tab; try { history.replaceState(null, '', '#' + state.resto + '-' + state.tab); } catch(e){} render(); });
  on('[data-plus]', b => { const c = cart(state.resto); c[b.dataset.plus] = (c[b.dataset.plus]||0)+1; render(); });
  on('[data-minus]', b => { const c = cart(state.resto); c[b.dataset.minus] = Math.max(0,(c[b.dataset.minus]||0)-1); render(); });
  on('[data-open]', () => { state.sheet = true; render(); });
  on('[data-close]', () => { state.sheet = false; render(); });
  on('[data-close-bg]', (o, e) => { if (e.target === o) { state.sheet = false; render(); } });
  const nama = document.getElementById('nama'), jam = document.getElementById('jam');
  if (nama) nama.oninput = e => { state.nama = e.target.value; refreshSheet(); };
  if (jam) jam.oninput = e => { state.jam = e.target.value; refreshSheet(); };
}
function refreshSheet(){
  const key = state.resto, href = waHref(key);
  document.getElementById('preview').textContent = buildMessage(key);
  const wa = document.getElementById('wa');
  wa.classList.toggle('disabled', !href); wa.href = href || '#';
  document.getElementById('err').textContent = href ? '' : L().needInfo;
}

/* ---------- ROUTING & LOAD ---------- */
function route(){
  const [r, t] = location.hash.replace('#','').split('-');
  state.sheet = false;
  state.resto = CFG.resto[r] ? r : null;
  state.tab = KAT.some(x => x.k === t) ? t : 'biasa';
  window.scrollTo(0,0);
  render();
}
async function load(){
  if (!SB_READY) { state.loading = false; route(); return; }
  state.loading = true; state.loadError = false; render();
  try { const c = await loadFromSupabase(); if (c) CFG = c; state.loading = false; }
  catch(e) { console.error(e); state.loading = false; state.loadError = true; }
  route();
}
window.addEventListener('hashchange', route);
load();

</script>
</body>
</html>
